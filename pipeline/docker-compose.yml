version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - data-pipeline

  collector:
    build: ./collector
    image: estate-collector:latest
    # 로컬 테스트용 스크립트 실행 컨테이너
    command: echo "Collector image built"
    networks:
      - data-pipeline

volumes:
  clickhouse-data:

networks:
  data-pipeline:
